<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191f2d"/>
      <stop offset="0.48" stop-color="#0c1119"/>
      <stop offset="1" stop-color="#1f1812"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#87d6a2"/>
      <stop offset="1" stop-color="#f0d277"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1440" height="960" fill="url(#bg)"/>
  <circle cx="170" cy="160" r="320" fill="#87d6a2" opacity="0.12"/>
  <circle cx="1260" cy="820" r="320" fill="#f0d277" opacity="0.11"/>

  <text x="92" y="108" fill="#87d6a2" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">WORKFLOW HUB DEMO</text>
  <text x="92" y="164" fill="#f8f5ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="48" font-weight="800">Link in, summary out,</text>
  <text x="92" y="214" fill="#f8f5ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="48" font-weight="800">table updated, ping sent</text>
  <text x="92" y="256" fill="#b6bfd0" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20">A fast no-key proof for the first real automation shape.</text>

  <g transform="translate(86 332)" filter="url(#shadow)">
    <rect width="1268" height="500" rx="36" fill="#0d121a" opacity="0.95"/>
    <rect x="28" y="28" width="1212" height="444" rx="28" fill="#101722" stroke="#fff" stroke-opacity="0.08"/>

    <g transform="translate(48 180)">
      <rect width="224" height="120" rx="28" fill="#182234"/>
      <text x="40" y="54" fill="#f8f5ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">1. Receive URL</text>
      <text x="40" y="84" fill="#aab5c6" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">Paste a public link into</text>
      <text x="40" y="108" fill="#aab5c6" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">the local intake form.</text>
    </g>

    <g transform="translate(344 180)">
      <rect width="224" height="120" rx="28" fill="#182234"/>
      <text x="34" y="54" fill="#f8f5ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">2. Summarize</text>
      <text x="34" y="84" fill="#aab5c6" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">Readable text is fetched</text>
      <text x="34" y="108" fill="#aab5c6" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">through `r.jina.ai`.</text>
    </g>

    <g transform="translate(640 180)">
      <rect width="224" height="120" rx="28" fill="#182234"/>
      <text x="36" y="54" fill="#f8f5ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">3. Log CSV</text>
      <text x="36" y="84" fill="#aab5c6" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">Append a summary row</text>
      <text x="36" y="108" fill="#aab5c6" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">for later review.</text>
    </g>

    <g transform="translate(936 180)">
      <rect width="224" height="120" rx="28" fill="#182234"/>
      <text x="40" y="54" fill="#f8f5ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">4. Notify</text>
      <text x="40" y="84" fill="#aab5c6" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">Send a local macOS</text>
      <text x="40" y="108" fill="#aab5c6" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">notification on finish.</text>
    </g>

    <g fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-width="12">
      <path d="M274 240 H326"/>
      <path d="M570 240 H622"/>
      <path d="M866 240 H918"/>
    </g>
    <g fill="#f0d277">
      <circle cx="326" cy="240" r="10"/>
      <circle cx="622" cy="240" r="10"/>
      <circle cx="918" cy="240" r="10"/>
    </g>

    <g transform="translate(52 52)">
      <text x="0" y="0" fill="#f0d277" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="16" font-weight="800">RUN LOG</text>
      <text x="0" y="32" fill="#9fb0c6" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="16">receive link -> summarize -> write to table -> notify</text>
    </g>

    <g transform="translate(720 342)">
      <rect width="440" height="88" rx="24" fill="url(#accent)"/>
      <text x="76" y="54" fill="#10131a" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="22" font-weight="900">FASTEST SHOWABLE PROOF</text>
    </g>
  </g>
</svg>
