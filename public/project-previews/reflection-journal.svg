<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2134"/>
      <stop offset="0.5" stop-color="#11162a"/>
      <stop offset="1" stop-color="#251b21"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f0ea"/>
      <stop offset="1" stop-color="#eadfce"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8be7dd"/>
      <stop offset="1" stop-color="#f6d37b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1440" height="960" fill="url(#bg)"/>
  <circle cx="210" cy="150" r="320" fill="#8be7dd" opacity="0.1"/>
  <circle cx="1260" cy="810" r="340" fill="#f6d37b" opacity="0.12"/>

  <text x="92" y="106" fill="#8be7dd" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">EVENING REFLECTION JOURNAL</text>
  <text x="92" y="164" fill="#f7f4ee" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="48" font-weight="800">A phone-friendly journal</text>
  <text x="92" y="214" fill="#f7f4ee" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="48" font-weight="800">for nightly review</text>
  <text x="92" y="256" fill="#b6bdcf" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20">Prompted writing, saved history, search, and sync.</text>

  <g transform="translate(132 304)" filter="url(#shadow)">
    <rect width="470" height="500" rx="46" fill="#0b1018" opacity="0.96"/>
    <rect x="18" y="18" width="434" height="464" rx="36" fill="url(#paper)"/>
    <text x="52" y="70" fill="#54463b" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="800">Sunday, June 22</text>
    <text x="52" y="114" fill="#1f1714" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="30" font-weight="800">What happened today?</text>
    <rect x="52" y="138" width="330" height="30" rx="15" fill="#efe3d5"/>
    <text x="74" y="158" fill="#6e6258" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="13" font-weight="800">raw fragments -> guided reflection -> saved entry</text>
    <g fill="#61564d" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18">
      <text x="52" y="214">Shipped portfolio updates, fixed project links,</text>
      <text x="52" y="246">and clarified what should be public vs local-only.</text>
      <text x="52" y="302">Reflection: the simplest useful flow won over the</text>
      <text x="52" y="334">clever dial experiment once the real job became clear.</text>
      <text x="52" y="390">Tomorrow: tighten the sync behavior and export path.</text>
    </g>
    <rect x="52" y="420" width="156" height="38" rx="16" fill="url(#accent)"/>
    <text x="100" y="445" fill="#101218" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15" font-weight="800">SAVE ENTRY</text>
    <rect x="224" y="420" width="104" height="38" rx="16" fill="#ece1d2"/>
    <text x="258" y="445" fill="#54463b" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15" font-weight="800">SYNC</text>
  </g>

  <g transform="translate(694 320)">
    <rect width="624" height="136" rx="28" fill="#121928" opacity="0.96" filter="url(#shadow)"/>
    <text x="34" y="46" fill="#f6d37b" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="16" font-weight="800">SEARCH SAVED NIGHTS</text>
    <rect x="30" y="62" width="564" height="46" rx="18" fill="#1a2335"/>
    <text x="56" y="91" fill="#93a1b6" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18">mood, task, fragment, journal text...</text>
  </g>

  <g transform="translate(694 488)">
    <rect width="624" height="314" rx="30" fill="#121928" opacity="0.96" filter="url(#shadow)"/>
    <text x="34" y="46" fill="#f7f4ee" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">Saved history</text>

    <g transform="translate(34 74)">
      <rect width="556" height="64" rx="20" fill="#182234"/>
      <text x="24" y="28" fill="#f7f4ee" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="800">June 21 · calm / productive</text>
      <text x="24" y="50" fill="#9ba9bc" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="16">Shipped the MVP and wrote down the tradeoffs clearly.</text>
    </g>

    <g transform="translate(34 154)">
      <rect width="556" height="64" rx="20" fill="#182234"/>
      <text x="24" y="28" fill="#f7f4ee" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="800">June 20 · tired / reflective</text>
      <text x="24" y="50" fill="#9ba9bc" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="16">The pivot away from the dial made the product more useful.</text>
    </g>

    <g transform="translate(34 234)">
      <rect width="556" height="46" rx="18" fill="url(#accent)"/>
      <text x="170" y="30" fill="#11141a" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="16" font-weight="800">PWA INSTALL + SUPABASE SYNC</text>
    </g>
  </g>
</svg>
