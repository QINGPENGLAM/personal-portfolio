<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151d2c"/>
      <stop offset="0.52" stop-color="#0a0f18"/>
      <stop offset="1" stop-color="#111b16"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121927"/>
      <stop offset="1" stop-color="#0b111a"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6ee4ff"/>
      <stop offset="1" stop-color="#f3d073"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="1440" height="960" fill="url(#bg)"/>
  <circle cx="200" cy="120" r="320" fill="#6ee4ff" opacity="0.12"/>
  <circle cx="1270" cy="820" r="320" fill="#f3d073" opacity="0.1"/>

  <rect x="56" y="56" width="1328" height="848" rx="36" fill="#0b1017" opacity="0.94" filter="url(#shadow)"/>
  <rect x="56" y="56" width="1328" height="848" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="96" y="108" fill="#6ee4ff" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3">PERSONAL AI WORKBENCH</text>
  <text x="96" y="162" fill="#f7f7f4" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="46" font-weight="800">PDF upload, chat,</text>
  <text x="96" y="210" fill="#f7f7f4" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="46" font-weight="800">and visible citations</text>
  <text x="96" y="252" fill="#9fb0c6" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="20">Open WebUI evaluation narrowed to the first useful RAG loop.</text>

  <g transform="translate(92 300)">
    <rect width="296" height="520" rx="28" fill="url(#panel)" stroke="#fff" stroke-opacity="0.08"/>
    <text x="28" y="46" fill="#f2f3ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">Library</text>
    <rect x="24" y="72" width="248" height="56" rx="18" fill="#172130" stroke="#6ee4ff" stroke-opacity="0.35"/>
    <text x="44" y="106" fill="#f2f3ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">QingPengLam_Resume.pdf</text>
    <rect x="24" y="146" width="248" height="56" rx="18" fill="#131b29"/>
    <text x="44" y="180" fill="#a5b2c4" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">research-notes.pdf</text>
    <rect x="24" y="220" width="248" height="56" rx="18" fill="#131b29"/>
    <text x="44" y="254" fill="#a5b2c4" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18" font-weight="700">system-design.pdf</text>
    <rect x="24" y="456" width="248" height="40" rx="14" fill="url(#chip)"/>
    <text x="92" y="482" fill="#0d1118" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="16" font-weight="800">UPLOAD PDF</text>
  </g>

  <g transform="translate(432 300)">
    <rect width="900" height="520" rx="30" fill="#101722" stroke="#fff" stroke-opacity="0.08"/>
    <rect x="28" y="28" width="844" height="62" rx="22" fill="#141d29"/>
    <text x="56" y="66" fill="#9fb0c6" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="18">Ask a question about the uploaded document...</text>
    <rect x="704" y="36" width="144" height="46" rx="18" fill="url(#chip)"/>
    <text x="758" y="66" fill="#10141b" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="16" font-weight="800">ASK</text>

    <rect x="40" y="122" width="396" height="124" rx="26" fill="#172130"/>
    <text x="68" y="164" fill="#f2f3ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">Can you summarize the candidate's</text>
    <text x="68" y="194" fill="#f2f3ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">experience with AI workflows and data systems?</text>
    <rect x="68" y="214" width="138" height="28" rx="14" fill="#203047"/>
    <text x="92" y="233" fill="#6ee4ff" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="13" font-weight="800">USER PROMPT</text>

    <rect x="464" y="122" width="388" height="210" rx="26" fill="#0f1a14" stroke="#87d6a2" stroke-opacity="0.28"/>
    <text x="492" y="164" fill="#f2f3ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">The resume emphasizes AI workflow automation,</text>
    <text x="492" y="194" fill="#f2f3ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">MCP-based tooling, data pipelines, and API work.</text>
    <text x="492" y="224" fill="#f2f3ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">It also shows hands-on dashboard and analytics</text>
    <text x="492" y="254" fill="#f2f3ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">experience across engineering-facing workflows.</text>
    <rect x="492" y="278" width="146" height="28" rx="14" fill="#193124"/>
    <text x="520" y="297" fill="#87d6a2" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="13" font-weight="800">CITED ANSWER</text>

    <rect x="40" y="364" width="812" height="124" rx="24" fill="#141d29"/>
    <text x="66" y="404" fill="#f3d073" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="16" font-weight="800">Source snippet</text>
    <text x="66" y="434" fill="#b7c3d2" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">"Built MCP-based internal tooling and reusable AI workflow skills to automate log retrieval,</text>
    <text x="66" y="464" fill="#b7c3d2" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="17">error triage, root cause analysis, code support, and Git/MR handoff flows."</text>

    <g transform="translate(40 502)">
      <rect width="184" height="44" rx="18" fill="#172130"/>
      <text x="56" y="28" fill="#f2f3ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15" font-weight="800">PDF RAG</text>
      <rect x="204" width="184" height="44" rx="18" fill="#172130"/>
      <text x="252" y="28" fill="#f2f3ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15" font-weight="800">Citations</text>
      <rect x="408" width="184" height="44" rx="18" fill="#172130"/>
      <text x="456" y="28" fill="#f2f3ef" font-family="Avenir Next, Helvetica, Arial, sans-serif" font-size="15" font-weight="800">Docker</text>
    </g>
  </g>
</svg>
